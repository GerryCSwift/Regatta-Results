<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Regatta Results</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#667; --head:#1e5bd8; --seed:#2a9d4a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#eee; --muted:#9aa; --head:#2f6fe8; --seed:#2a9d4a; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--head); }
  h1 { font-size:1.4rem; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:10px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:.75rem; color:#fff;
           background:#c27a00; vertical-align:middle; margin-left:6px; }
  .badge.final { background:#2a9d4a; }
  .legend { font-size:.8rem; margin:0 0 10px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .legend span { padding:1px 6px; }
  .wrap { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:2px; white-space:nowrap; }
  th { background:var(--head); color:#fff; font-weight:600; padding:3px 8px; }
  th.seed { background:var(--seed); }
  td { padding:3px 8px; text-align:center; }
  td.name { text-align:right; }
  td.score sup { font-size:.6rem; margin-left:2px; opacity:.85; }
  .out { outline:2px solid var(--fg); outline-offset:-2px; }
  .sh-red { background:#ff3b30; color:#fff; }
  .sh-r2 { background:rgba(255,59,48,.2); }
  .sh-r5 { background:rgba(255,59,48,.5); }
  .sh-g  { background:rgba(52,199,89,.3); }
  #err { color:#c00; }
  .foot { color:var(--muted); font-size:.75rem; margin-top:16px; }
</style>
</head>
<body>
<h1 id="title">Loading…</h1>
<div class="meta" id="meta"></div>
<div class="legend">
  <span class="out">Discard</span><span class="sh-r2">DNx</span><span class="sh-r5">DSQ, DNE</span><span class="sh-g">RDG</span>
</div>
<div class="wrap"><table id="tbl"></table></div>
<p id="err"></p>
<div class="foot">Scoring by ezRegatta, a Broadreach Services Application</div>

<script>
// EDIT: address of the data repo's GitHub Pages site (no trailing slash)
const DATA_BASE = 'https://gerrycswift.github.io/ezregatta-data';

const slug = new URLSearchParams(location.search).get('r') || '';
const SLUG_OK = /^[a-f0-9]{16,64}$/;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => String(Math.round(Number(n) * 10) / 10);
// same order as heatColors in the app (index 0 = none)
const PALETTE = [null,'#34C759','#FF9500','#007AFF','#FF3B30','#30B0C7','#AF52DE','#5856D6','#FFCC00'];
const SHADE = { NotScored:'sh-red', RET:'sh-r2', DNC:'sh-r2', DNF:'sh-r2', DNS:'sh-r2', OCS:'sh-r2', ZFP:'sh-r2',
  SCP:'sh-r2', NSC:'sh-r2', DPI:'sh-r2', DNE:'sh-r5', DSQ:'sh-r5', BFD:'sh-r5', UFD:'sh-r5', DGM:'sh-r5',
  WDN:'sh-r5', RDG:'sh-g', RDGm:'sh-g' };
const textOn = hex => { const n = parseInt(hex.slice(1), 16);
  return ((n>>16)*299 + ((n>>8)&255)*587 + (n&255)*114) / 1000 > 150 ? '#111' : '#fff'; };
let timer;

async function load() {
  try {
    const res = await fetch(`${DATA_BASE}/regattas/${slug}.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('Results not found. Check the link, or the organiser may have removed them.');
    render(await res.json());
    document.getElementById('err').textContent = '';
  } catch (e) { document.getElementById('err').textContent = e.message; }
}

function render(d) {
  const t = d.table;
  document.title = d.name + ' – Results';
  document.getElementById('title').innerHTML =
    esc(d.name) + `<span class="badge ${d.isFinal ? 'final' : ''}">${d.isFinal ? 'Final' : 'In progress'}</span>`;
  const series = SLUG_OK.test(d.seriesSlug || '')
    ? `<a href="series.html?s=${encodeURIComponent(d.seriesSlug)}">${esc(d.seriesName)} standings</a> · ` : '';
  document.getElementById('meta').innerHTML = series + new Date(d.startDate).toLocaleDateString(undefined, {dateStyle:'long'})
    + ' · Updated ' + new Date(d.updated).toLocaleString();

  let h = '<thead><tr>';
  if (t.showFleet) h += '<th>Fleet</th>';
  h += '<th>Place</th>';
  if (t.showCountry) h += '<th>Country</th>';
  h += '<th>Sail</th><th>Name</th>';
  if (t.showDesign) h += '<th>Design</th>';
  h += '<th>Net</th><th>Gross</th>';
  for (const c of t.columns) h += `<th class="${c.isSeed ? 'seed' : ''}">R ${esc(c.number)}</th>`;
  h += '</tr></thead><tbody>';

  for (const r of t.rows) {
    h += '<tr>';
    if (t.showFleet) {
      const col = PALETTE[r.fleetColorIndex];
      h += `<td${col ? ` style="background:${col};color:${textOn(col)}"` : ''}>${esc(r.fleetName)}</td>`;
    }
    h += `<td>${esc(r.place)}</td>`;
    if (t.showCountry) h += `<td>${esc(r.country)}</td>`;
    h += `<td>${esc(String(r.sail).padStart(2, '0'))}</td><td class="name">${esc(r.name)}</td>`;
    if (t.showDesign) h += `<td>${esc(r.design)}</td>`;
    h += `<td>${num(r.net)}</td><td>${num(r.gross)}</td>`;
    for (const c of r.cells) {
      if (!c) { h += '<td>-</td>'; continue; }
      const cls = ['score', SHADE[c.code] || '', c.thrownOut ? 'out' : ''].join(' ');
      h += `<td class="${cls}">${num(c.score)}${c.code ? `<sup>${esc(c.code)}</sup>` : ''}</td>`;
    }
    h += '</tr>';
  }
  document.getElementById('tbl').innerHTML = h + '</tbody>';

  clearInterval(timer);
  if (!d.isFinal) timer = setInterval(load, 60000);
}

if (!SLUG_OK.test(slug)) document.getElementById('err').textContent = 'No results specified. Use the link from the organiser.';
else load();
</script>
</body>
</html>
