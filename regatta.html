<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regatta Results</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#667; --head:#1e5bd8; --seed:#2a9d4a; --line:#d8dce3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --fg:#eee; --muted:#9aa; --head:#2f6fe8; --seed:#2a9d4a; --line:#2a2f38; }
  }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color:var(--head); }
  h1 { font-size:1.4rem; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:.85rem; margin-bottom:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:.75rem; color:#fff;
           background:#c27a00; vertical-align:middle; margin-left:6px; }
  .badge.final { background:#2a9d4a; }
  .wrap { overflow-x:auto; }
  table { border-collapse:separate; border-spacing:2px; white-space:nowrap; }
  th { background:var(--head); color:#fff; font-weight:600; padding:3px 8px; }
  th.seed { background:var(--seed); }
  td { padding:3px 8px; text-align:center; }
  td.name { text-align:right; }
  td.score.out { outline:2px solid var(--fg); outline-offset:-2px; }
  td.score { color:#111; }
  #err { color:#c00; }
</style>
</head>
<body>
<p><a href="./">&larr; All regattas</a></p>
<h1 id="title">Loading…</h1>
<div class="meta" id="meta"></div>
<div class="wrap"><table id="tbl"></table></div>
<p id="err"></p>

<script>
const slug = new URLSearchParams(location.search).get('r');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => String(Math.round(n * 10) / 10);
let timer;

async function load() {
  try {
    const res = await fetch(`data/regattas/${encodeURIComponent(slug)}.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error('Results not found');
    render(await res.json());
    document.getElementById('err').textContent = '';
  } catch (e) {
    document.getElementById('err').textContent = e.message;
  }
}

function render(d) {
  document.title = d.name + ' – Results';
  document.getElementById('title').innerHTML =
    esc(d.name) + `<span class="badge ${d.isFinal ? 'final' : ''}">${d.isFinal ? 'Final' : 'In progress'}</span>`;
  const series = d.seriesName ? `<a href="./?series=${encodeURIComponent(d.seriesSlug)}">${esc(d.seriesName)}</a> · ` : '';
  document.getElementById('meta').innerHTML = series + 'Updated ' + new Date(d.updated).toLocaleString();

  let h = '<thead><tr>';
  if (d.showFleet) h += '<th>Fleet</th>';
  h += '<th>Place</th>';
  if (d.showCountry) h += '<th>Country</th>';
  h += '<th>Sail</th><th>Name</th>';
  if (d.showDesign) h += '<th>Design</th>';
  h += '<th>Net</th><th>Gross</th>';
  for (const r of d.races) h += `<th class="${r.isSeed ? 'seed' : ''}">R ${r.number}</th>`;
  h += '</tr></thead><tbody>';

  for (const s of d.skippers) {
    h += '<tr>';
    if (d.showFleet) h += `<td${s.fleetColor ? ` style="background:${esc(s.fleetColor)};color:#111"` : ''}>${esc(s.fleet)}</td>`;
    h += `<td>${esc(s.place)}</td>`;
    if (d.showCountry) h += `<td>${esc(s.country)}</td>`;
    h += `<td>${esc(s.sail)}</td><td class="name">${esc(s.name)}</td>`;
    if (d.showDesign) h += `<td>${esc(s.design)}</td>`;
    h += `<td>${num(s.net)}</td><td>${num(s.gross)}</td>`;
    for (const sc of s.scores) {
      if (!sc) { h += '<td>-</td>'; continue; }
      const bg = sc.color ? ` style="background:${esc(sc.color)}"` : '';
      h += `<td class="score${sc.thrownOut ? ' out' : ''}"${bg}>${num(sc.score)}</td>`;
    }
    h += '</tr>';
  }
  document.getElementById('tbl').innerHTML = h + '</tbody>';

  clearInterval(timer);
  if (!d.isFinal) timer = setInterval(load, 60000);   // keep refreshing until final
}

if (!slug) document.getElementById('err').textContent = 'No regatta specified.';
else load();
</script>
</body>
</html>
